[package]
name = "limitbar"
version = "2.2.0"
edition = "2024"
description = "Tiny Windows 11 taskbar widget for AI plan usage limits (Claude, Codex, Grok, Cursor), any provider you add, and your PC's CPU, memory and GPU load"
publish = false

[dependencies]
serde_json = "1"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

